<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figurinhas Pokémon</title>
    <link rel="stylesheet" href="pokemoncards.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <h1>FIGURINHAS POKÉMON</h1>
            <p class="subtitle">Colecione todas!</p>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title">Minhas Cartinhas</h2>
            
            <div class="album">

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/87.gif" alt="Figurinha 87">
                        <div class="card-number">#87</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Dewgong</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/91.gif" alt="Figurinha 91">
                        <div class="card-number">#91</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Cloyster</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/124.gif" alt="Figurinha 124">
                        <div class="card-number">#124</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Jynx</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/131.gif" alt="Figurinha 131">
                        <div class="card-number">#131</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Lapras</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/144.gif" alt="Figurinha 144">
                        <div class="card-number">#144</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Articuno</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>aqui ficaria um ©</p>
    </footer>
</body>
</html>
