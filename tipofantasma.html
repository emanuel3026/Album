<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figurinhas Pokémon</title>
    <link rel="stylesheet" href="pokemoncards.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <h1>FIGURINHAS POKÉMON</h1>
            <p class="subtitle">Colecione todas!</p>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title">Minhas Cartinhas</h2>
            
            <div class="album">

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/7.gif" alt="Figurinha 7">
                        <div class="card-number">#07</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Squirtle</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/8.gif" alt="Figurinha 8">
                        <div class="card-number">#08</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Wartortle</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/9.gif" alt="Figurinha 9">
                        <div class="card-number">#09</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Blastoise</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>aqui ficaria um ©</p>
    </footer>
</body>
</html>
