<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figurinhas Pokémon</title>
    <link rel="stylesheet" href="pokemoncards.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <h1>FIGURINHAS POKÉMON</h1>
            <p class="subtitle">Colecione todas!</p>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title">Minhas Cartinhas</h2>
            
            <div class="album">
                <!-- Cartinha 1 -->
                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/56.png" alt="Figurinha 56">
                        <div class="card-number">#056</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Pokémon 56</span>
                    </div>
                </div>

                <!-- Cartinha 2 -->
                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/57.png" alt="Figurinha 57">
                        <div class="card-number">#057</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Pokémon 57</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>aqui ficaria um ©</p>
    </footer>
</body>
</html>
