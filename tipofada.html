<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figurinhas Pokémon</title>
    <link rel="stylesheet" href="pokemoncards.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <h1>FIGURINHAS POKÉMON</h1>
            <p class="subtitle">Colecione todas!</p>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title">Minhas Cartinhas</h2>
            
            <div class="album">

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/35.png" alt="Figurinha 35">
                        <div class="card-number">#35</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Clefairy</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/36.png" alt="Figurinha 36">
                        <div class="card-number">#36</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Clefable</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/39.png" alt="Figurinha 39">
                        <div class="card-number">#39</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Jigglypuff</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/40.png" alt="Figurinha 40">
                        <div class="card-number">#40</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Wigglytuff</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/122.png" alt="Figurinha 122">
                        <div class="card-number">#122</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Mr. Mime</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>aqui ficaria um ©</p>
    </footer>
</body>
</html>
