<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figurinhas Pokémon</title>
    <link rel="stylesheet" href="pokemoncards.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <h1>FIGURINHAS POKÉMON</h1>
            <p class="subtitle">Colecione todas!</p>
        </div>
    </header>

    <main>
        <div class="container">
            <h2 class="section-title">Minhas Cartinhas</h2>
            
            <div class="album">

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/147.gif" alt="Figurinha 147">
                        <div class="card-number">#147</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Dratini</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/148.gif" alt="Figurinha 148">
                        <div class="card-number">#148</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Dragonair</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-inner">
                        <img src="imagens/149.gif" alt="Figurinha 149">
                        <div class="card-number">#149</div>
                    </div>
                    <div class="card-info">
                        <span class="card-name">Dragonite</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>aqui ficaria um ©</p>
    </footer>
</body>
</html>
